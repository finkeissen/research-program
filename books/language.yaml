id: language
title: Research Program Language — Linguistic Forensics as a Tool
title-de: "Forschungsprogramm Sprache — Linguistische Forensik als Werkzeug"
type: book
role: planned-domain
status: planned

abstract: >
  Planned volume 18 (master plan): language as the place where cuts are set and concealed;
  linguistic forensics as a testing tool for concept piracy and meaning shift. Connects to
  speech-act theory (performative/constative) and to the philosophy notes (meaning as a cut).
core-assumptions:
  - meaning is cut, not found; words stabilize cuts
  - forensic inspection of terms precedes agreement on facts

focus:
  - speech acts
  - term piracy detection
  - meaning-drift measurement

relations:
  grounded-in:
    - physics-effect
  enables:
    - history
  informed-by:
    - ontology
