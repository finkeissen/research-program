id: raumzeit
title: Research Program Spacetime — Game-Theoretic Entry into Physics and Chemistry
title-de: "Forschungsprogramm Raumzeit — Reichweite und Grenzen von Modellen"
type: book
role: natural-science-foundation
status: stable

abstract: >
  Early founding volume of the program on physics as model-making about notions of space and
  time. The most extensive finished stock (88 PDF versions) forms the physical backdrop on which
  the volumes Physics-Effect (Ur-Grammar) and Physics (atomic context) later build.
core-assumptions:
  - space and time are model outputs, not pre-given containers
  - every physical statement carries a declared range of validity
  - the limit of a model is information, not failure
  - observation is participation, not detached depiction

focus:
  - range of validity of models
  - relativity as cut-declaration
  - cosmology without privileged observer
  - boundary between physics and metaphysics

relations:
  grounded-in:
    - physics-effect
  enabled-by:
    - seven-layers-thinking
  informs:
    - physics
    - chemistry
    - ontology

