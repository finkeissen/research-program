id: staat
title: Research Program State — Testing Instead of Theory
title-de: "Forschungsprogramm Staat — Organisation legitimer Ordnung"
type: book
role: collective-coordination-context
status: stable

abstract: >
  Published domain volume on the state as the coordination structure of collective action:
  legitimacy, monopoly of force, law-making and administration as the operative controllability
  of cuts at the level of society. Distinct from the volume Politics, which describes power as
  an attitude; here it is about the institutional form in which power is held.
core-assumptions:
  - the state is a coordination structure, not a moral agent
  - legitimacy is measured by auditable decision paths, not by origin claims
  - monopoly of force is a declared cut requiring explicit admissibility rules
  - institutions outlive individuals only through correction mechanisms

focus:
  - legitimacy and accountability
  - separation of powers as structural cuts
  - administration as compressed decision memory
  - citizenship as role, not identity

