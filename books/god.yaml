id: god
title: Research Program God — From Wish to Examination
title-de: "Forschungsprogramm Gott — Vom Wunsch zur Prüfung"
type: book
role: origin-question
status: stable

abstract: >
  The originating question of the program. The isolation argument: the question of God can only
  be posed if all borrowed foundations are systematically removed. Stage 0 forms the bridge to
  ontology (where does the drive for unity come from?).
core-assumptions:
  - borrowed foundations must be removed before the question can be posed
  - the unity-drive is an object of inquiry, not an answer
  - stage 0 connects existential questioning to operational ontology

focus:
  - isolation argument
  - origin question
  - unity drive
  - bridge to ontology

