id: life-lies
title: Research Program Life-Lies — Architecture of Human Self-Deception
title-de: "Forschungsprogramm Lebenslügen — Architektur menschlicher Selbsttäuschung"
type: book
role: personal-demolition
status: stable

abstract: >
  The personal wrecking ball of the program. Life-lies are treated not as individual mistakes
  but as structurally necessary constructs without which the ego could not survive. What this
  book demolishes is rebuilt in the other volumes.
core-assumptions:
  - self-deception is structurally necessary, not contingent failure
  - demolition precedes reconstruction; the program orders itself accordingly
  - honesty is the removal of inner reservations, not a virtue
  - the ego cannot be studied without its lies being named first

focus:
  - life-lies as architecture
  - ego-preservation mechanisms
  - demolition function within the program
  - bridge to EGO and seven-layers-thinking

relations:
  grounded-in:
    - physics-effect
  enables:
    - ego
  informs:
    - psychology
