id: physics-effect
title: The Physics Effect
title-de: "Der Physik-Effekt — UrGrammatik für Wissen, Philosophie & KI"
type: book
role: foundational-grammar
status: stable

abstract: >
  A foundational grammar for understanding reality, knowledge,
  and decision-making based on effects, relations, and transformations
  rather than objects or representations.

core-assumptions:
  - reality is composed of effects, relations, and transformations
  - knowledge arises from measurement as interaction
  - validity replaces absolute truth as a guiding criterion

focus:
  - effects
  - relations
  - transformations
  - measurement
  - uncertainty
  - validity

