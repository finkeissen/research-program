id: family
title: Research Program Family — Passing on Life
title-de: "Forschungsprogramm Familie — Weitergabe des Lebens"
type: book
role: domain-application-biological
status: stable

abstract: >
  Zweigeteiltes Buch: kompakter Haupttext (eine These pro Absatz), Anhang mit
  Gegenpositionen und Evidenzstand. Zentrale Kategorie ist der Familienvertrag —
  Bargaining Power, Mental Load und biologische Randbedingungen, bewusst nicht
  klassenspezifisch abgeleitet.

core-assumptions:
  - reproduction is a contractual arrangement before it is a narrative
  - bargaining power and mental load are measurable inside the contract
  - biological constraints are part of the model, not external noise

focus:
  - family contract
  - bargaining power
  - mental load
  - biological boundary conditions

