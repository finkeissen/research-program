id: ontology
title: Research Program Applied Ontology — Are Data, Information and Knowledge Real?
title-de: "Forschungsprogramm Ontologie — Sind Daten, Informationen & Wissen real?"
type: book
role: operative-implementation
status: stable

abstract: >
  Die operative Implementierung der Grundthese. Daten, Information und Wissen
  sind unzulässig, aber notwendig — diese Beobachtung ändert nichts an der
  Praxis, solange sie nicht in prüfbare Strukturen übersetzt wird. Das Buch
  legt das Fundament für die Buchreihe und für github.com/finkeissen zugleich.

core-assumptions:
  - inadmissibility becomes workable only through explicit structure
  - data/information/knowledge are declared cuts, not layers of being
  - the repository is this book's operational half

focus:
  - admissibility declarations
  - data-information-knowledge distinction as cut
  - foundation for matrix and repository

